[package]
name = "knapp"
version = "0.1.1"
edition = "2021"
description = "Herdr plugin that browses a tree of Markdown notes by its links: backlinks, unresolved links, orphans, and the local graph"
license = "MIT"
repository = "https://github.com/shindakun/herdr-knapp"
readme = "README.md"
keywords = ["herdr", "markdown", "obsidian", "wikilinks", "tui"]
categories = ["command-line-utilities"]
exclude = ["fixtures/"]

[dependencies]
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny-skia = "0.12"
toml = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
