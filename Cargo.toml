[package]
name = "knapp"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin that browses a tree of Markdown notes by its links: backlinks, unresolved links, orphans, and the local graph"
license = "MIT"
repository = "https://github.com/shindakun/herdr-knapp"
readme = "README.md"
keywords = ["herdr", "markdown", "obsidian", "wikilinks", "tui"]
categories = ["command-line-utilities"]
exclude = ["fixtures/"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-normalization = "0.1"

[profile.release]
lto = true
strip = true
