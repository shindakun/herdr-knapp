id = "shindakun.knapp"
name = "Knapp"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Browse a tree of Markdown notes and its links"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "notes"
title = "Knapp"
placement = "split"
command = ["./target/release/knapp", "pane"]
